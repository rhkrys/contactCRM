<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#565aa0">
<title>ContactCRM</title>
<link rel="stylesheet" href="styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- ========== SIGN-IN SCREEN ========== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">☁️</div>
    <h1>ContactCRM</h1>
    <p class="login-tagline">Your private client dashboard.<br>Data stays in this browser, encrypted.</p>
    <div id="gsi-button"></div>
    <button id="demo-login" class="btn-ghost">Continue without Google (local demo)</button>
    <p class="login-note">Sign-in verifies who you are; contact data is never uploaded.</p>
  </div>
</div>

<!-- ========== APP SHELL ========== -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-dot"></span>
      <span class="brand-name">ContactCRM</span>
    </div>
    <div class="topbar-user">
      <img id="user-avatar" class="user-avatar" alt="" hidden>
      <span id="user-name" class="user-name"></span>
      <button id="signout" class="btn-ghost btn-small">Sign out</button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <nav class="tabbar" role="tablist">
    <button class="tab active" data-view="dashboard" role="tab">
      <span class="tab-icon">▦</span><span class="tab-label">Dashboard</span>
    </button>
    <button class="tab" data-view="contacts" role="tab">
      <span class="tab-icon">👤</span><span class="tab-label">Contacts</span>
    </button>
    <button class="tab" data-view="pipelines" role="tab">
      <span class="tab-icon">📊</span><span class="tab-label">Pipelines</span>
    </button>
    <button class="tab" data-view="reminders" role="tab">
      <span class="tab-icon">🔔</span><span class="tab-label">Reminders</span>
    </button>
    <button class="tab" data-view="settings" role="tab">
      <span class="tab-icon">⚙︎</span><span class="tab-label">Settings</span>
    </button>
  </nav>
</div>

<!-- ========== MODAL ROOT ========== -->
<div id="modal-root"></div>

<script src="crypto.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
